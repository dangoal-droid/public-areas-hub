<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="100%" height="100%">
  <defs>
    <style>
      .red-title {
        font-family: "Times New Roman", "Georgia", "Cinzel", serif;
        font-weight: 900;
        fill: #ba131b;
        stroke: #000000;
        stroke-width: 3.5px;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .black-sub {
        font-family: "Arial", "Helvetica", sans-serif;
        font-weight: 900;
        fill: #000000;
        letter-spacing: 18px;
      }
    </style>

    <!-- Metallic Silver 7 replacing V -->
    <g id="silver7">
      <path d="M 0 16 L -18 34 L 4 22 L 6 0 L 88 0 L 88 18 L 44 132 L 20 132 L 62 18 L 10 18 Z" 
            fill="#808285" 
            stroke="#000000" 
            stroke-width="3.5" 
            stroke-linejoin="round" 
            stroke-linecap="round" />
    </g>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <g transform="translate(50, 30)">
    <!-- ROW 1: SIL [7] ER -->
    <g transform="translate(0, 0)">
      <text x="420" y="165" text-anchor="end" font-size="170" class="red-title" letter-spacing="-2">SIL</text>
      <use href="#silver7" x="432" y="22" transform="scale(1.18)" />
      <text x="536" y="165" text-anchor="start" font-size="170" class="red-title" letter-spacing="-2">ER</text>
    </g>

    <!-- ROW 2: SE [7] ENS -->
    <g transform="translate(0, 180)">
      <text x="420" y="165" text-anchor="end" font-size="170" class="red-title" letter-spacing="-2">SE</text>
      <use href="#silver7" x="432" y="22" transform="scale(1.18)" />
      <text x="536" y="165" text-anchor="start" font-size="170" class="red-title" letter-spacing="-2">ENS</text>
    </g>

    <!-- ROW 3: HOTEL & CASINO -->
    <text x="530" y="500" font-size="46" text-anchor="middle" class="black-sub">HOTEL &amp; CASINO</text>
  </g>
</svg>